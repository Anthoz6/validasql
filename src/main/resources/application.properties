spring.application.name=validasql

# Las plataformas de despliegue indican el puerto con la variable PORT; en local se usa 8080.
server.port=${PORT:8080}

# Responde las peticiones en curso antes de apagar el contenedor.
server.shutdown=graceful

# Comprime el JSON de la API y los archivos de la página.
server.compression.enabled=true
server.compression.mime-types=application/json,text/css,application/javascript,text/html
